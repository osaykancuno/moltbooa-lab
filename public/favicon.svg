<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0f"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" fill="none" stroke="#2a2a44" stroke-width="1"/>

  <!-- "M" in cyan pixel art - left side -->
  <!-- Left vertical bar -->
  <rect x="4" y="6" width="3" height="20" fill="#22d3ee"/>
  <!-- Left diagonal down-right -->
  <rect x="7" y="9" width="3" height="3" fill="#22d3ee"/>
  <rect x="10" y="12" width="3" height="3" fill="#22d3ee"/>
  <!-- Right diagonal down-left -->
  <rect x="13" y="9" width="3" height="3" fill="#22d3ee"/>
  <rect x="10" y="12" width="3" height="3" fill="#22d3ee"/>
  <!-- Right vertical bar of M -->
  <rect x="16" y="6" width="3" height="20" fill="#22d3ee"/>
  <!-- M top caps -->
  <rect x="4" y="6" width="3" height="3" fill="#22d3ee"/>
  <rect x="16" y="6" width="3" height="3" fill="#22d3ee"/>

  <!-- "B" in purple pixel art - right side, overlapping slightly -->
  <!-- Vertical bar -->
  <rect x="15" y="6" width="3" height="20" fill="#8b5cf6" opacity="0.85"/>
  <!-- Top horizontal -->
  <rect x="18" y="6" width="6" height="3" fill="#8b5cf6"/>
  <!-- Top-right corner -->
  <rect x="24" y="9" width="3" height="3" fill="#8b5cf6"/>
  <!-- Middle horizontal -->
  <rect x="18" y="14" width="6" height="3" fill="#8b5cf6"/>
  <!-- Bottom-right bump upper -->
  <rect x="24" y="17" width="3" height="6" fill="#8b5cf6"/>
  <!-- Bottom horizontal -->
  <rect x="18" y="23" width="6" height="3" fill="#8b5cf6"/>
  <!-- Top-right inner -->
  <rect x="24" y="9" width="3" height="5" fill="#8b5cf6"/>

  <!-- Scanline effect for CRT feel -->
  <rect x="0" y="10" width="32" height="1" fill="#22d3ee" opacity="0.06"/>
  <rect x="0" y="16" width="32" height="1" fill="#22d3ee" opacity="0.06"/>
  <rect x="0" y="22" width="32" height="1" fill="#22d3ee" opacity="0.06"/>

  <!-- Glow effect on overlap zone -->
  <rect x="15" y="6" width="4" height="20" fill="#a78bfa" opacity="0.15"/>
</svg>
